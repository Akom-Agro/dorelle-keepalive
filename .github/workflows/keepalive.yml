name: Garder la base Supabase active

on:
  schedule:
    - cron: "0 6 */2 * *"   # tous les 2 jours à 06:00 UTC
  workflow_dispatch: {}      # bouton « Run workflow » pour tester à la main

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Interroger la base (fonction publique compteurs_contenu)
        run: |
          code=$(curl -sS -m 30 -o /tmp/reponse.json -w "%{http_code}" \
            -X POST "https://kjlirswjikhrgkhmcdaa.supabase.co/rest/v1/rpc/compteurs_contenu" \
            -H "apikey: sb_publishable_QSC4_9N12bMmIhBwvC0PiQ_YY98gAB9" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Code HTTP : $code"
          if [ "$code" != "200" ]; then
            echo "La base n'a pas répondu correctement."
            cat /tmp/reponse.json || true
            exit 1
          fi
          echo "Base active."
